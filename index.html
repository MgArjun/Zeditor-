function split(){

#zg2{position:absolute;inset:0;pointer-events:none}
#zgd{display:none!important}
.zrail{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3;max-height:calc(100% - 8px);overflow:auto;scrollbar-width:none;transition:opacity .25s}
.zrail.l{left:6px}
.zrail.r{right:6px}
.zrail .rb{width:38px;height:38px;min-width:38px;min-height:38px;padding:0;border-radius:12px;background:rgba(10,10,14,.72);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:var(--t);flex:none}
.zrail .rb svg{width:20px;height:20px}
.zrail .rb:active{background:var(--soft)}
html.zp-norail .zrail{display:none}

/* timeline */
#tl{height:var(--tlh);background:linear-gradient(180deg,#09090c,#050507);scrollbar-width:none;contain:layout paint style}
.rul{position:sticky;top:0;z-index:4;background:linear-gradient(#141419,#0b0b0e)}
.clip{background:linear-gradient(180deg,#46557a,#2b3556)}
.clip.A{background:linear-gradient(180deg,#2f8f78,#1b5e4f)}
.clip.T{background:linear-gradient(180deg,#c99a45,#8b6325)}
.clip.F{background:linear-gradient(180deg,#8a6fe0,#5a43a8)}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--a),0 0 18px var(--glow)}
.clip u{background:var(--a)}
.clip u::after{background:rgba(0,0,0,.55)}
#ph{background:linear-gradient(#fff,var(--a));box-shadow:0 0 12px var(--glow)}
#ph::before{border-top-color:var(--a)}

/* bottom dock: category menu + focus mode */
.bar{background:linear-gradient(180deg,#121217,#0a0a0d);border-top:1px solid rgba(255,255,255,.07)}
.bar button{min-width:54px;min-height:50px;padding:3px 4px;font-size:10.5px;gap:3px;border-radius:14px;color:var(--t)}
.grp button{min-height:52px;color:var(--m)}
.bar button.act{background:linear-gradient(180deg,var(--soft),rgba(255,255,255,.03));color:var(--a)}
.bar button.act svg{color:var(--a)}
.bar.fc{flex-direction:row;align-items:center;gap:6px}
.bar.fc .grp{width:auto;flex:none}
.bar.fc .grp button:not(.act){display:none}
.bar.fc .grp button.act{flex:none;flex-direction:row;min-width:0;gap:6px;min-height:46px;padding:0 16px 0 10px;border-radius:999px;background:var(--g);color:var(--on);font-weight:600;font-size:12px;box-shadow:0 4px 16px var(--glow)}
.bar.fc .grp button.act svg{color:var(--on)}
.bar.fc .grp button.act span::before{content:"\2039\00a0"}
.bar.fc .sub{width:auto;flex:1 1 0;min-width:0;border-top:0;padding-top:0}
html.zp-nolbl .sub button span{display:none}
#zdh{height:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#121217,#0f0f13);touch-action:pan-y}
#zdh i{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
html.zp-dock .bar,html.zp-dock #qt,html.zp-dock #zdh{display:none!important}
#zdt,#zst{position:fixed;z-index:19;display:none;align-items:center;justify-content:center;padding:0;color:var(--a);background:rgba(14,14,18,.82);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 1px var(--soft)}
#zdt{right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:16px}
#zst{right:0;bottom:46%;width:36px;height:68px;border-radius:16px 0 0 16px;z-index:60}
#zdt.on,#zst.on{display:flex;animation:zpIn .3s ease-out}
@keyframes zpIn{from{opacity:0;transform:translateX(16px)}}
#qt{background:linear-gradient(180deg,#1a1a21,#0f0f13);border-top:1px solid rgba(255,255,255,.07)}
#qt .an.on{background:var(--g);color:var(--on)}

/* sheets */
#bin,#adj,#adj3,#adj4,#adj5,#adj6,#adj7,#imenu,.zsh{background:linear-gradient(180deg,rgba(30,30,38,.86),rgba(10,10,14,.94));border:1px solid rgba(255,255,255,.1);border-bottom:0;border-radius:28px 28px 0 0;-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -18px 50px rgba(0,0,0,.75);overscroll-behavior:contain;will-change:transform;transition:transform .34s cubic-bezier(.22,1,.36,1)}
.zmin{transform:translateX(110%)!important;pointer-events:none}
.im svg{color:var(--a)}
.ch button{background:linear-gradient(180deg,#26262e,#18181e);border:1px solid rgba(255,255,255,.07);border-radius:999px;min-height:34px}
.ch button.on,.hd button.on{background:var(--g);color:var(--on);font-weight:600;border-color:transparent;box-shadow:0 2px 12px var(--glow)}
.lk.on{border-color:var(--a);box-shadow:0 0 14px var(--glow)}
.pb i,#vm{background:var(--g)}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--soft),0 3px 10px rgba(0,0,0,.7)}
.zh{font:600 11px Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin:16px 0 4px}
.zc{font-size:12px;color:var(--m);margin:8px 0 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#zpn{width:100%;min-height:42px;background:var(--l);color:var(--t);border:0;border-radius:10px;padding:0 10px;font:16px Inter,system-ui,sans-serif}
.xb button{display:flex;align-items:center;justify-content:center;gap:8px}
#zr2{background:linear-gradient(#ee5a5f,#b5303a);color:#fff;box-shadow:none;border:0}
#toast{border:1px solid var(--soft)}
html.zp-calm *{transition:none!important;animation:none!important}

/* landscape / short screens */
@media (orientation:landscape) and (max-height:520px){
 .top{height:40px}
 .tr{height:40px}
 .jg{display:none}
 #tl{height:calc(var(--tlh)*.62)}
 #pv{min-height:80px}
 .sub button span{display:none}
 .bar button{min-height:40px}
 .grp button{min-height:42px}
}

<script id="zp5js">
/*zp-v5*/
(()=>{
const part=(n,f)=>{try{f()}catch(e){console.error('zp5 '+n,e)}};
const KEY='zp5';
const TH={
 gold:{n:'Midnight',a:'#5aa2ff',g1:'#a9d4ff',g2:'#4f8cff',g3:'#2a5bd6',on:'#04101f'},
 aurora:{n:'Aurora',a:'#9d8bff',g1:'#a58bff',g2:'#4f8cff',g3:'#2fd0ff',on:'#ffffff'},
 emerald:{n:'Emerald',a:'#4be3a5',g1:'#8ef5c9',g2:'#2fc58e',g3:'#12896a',on:'#04150e'},
 rose:{n:'Rose',a:'#ff7aa6',g1:'#ffa6c2',g2:'#ff5c8d',g3:'#c4306d',on:'#1c0610'},
 ice:{n:'Ice',a:'#8adcff',g1:'#c0efff',g2:'#6cc6f6',g3:'#3b8fe3',on:'#04131d'}
};
const IS=[19,22,25,28],TLH=[150,200,260,330],RT=['auto','16:9','9:16','1:1','4:5','21:9'],GD=['Off','Thirds','Centre','Safe area','Grid'];
const DEF={th:'gold',is:1,lb:1,tl:1,sr:1,hp:1,an:1,rt:'auto',gd:0,sn:1};
let P=Object.assign({},DEF);
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'};
const root=document.documentElement;
const pv=$('#pv'),cv=$('#cv'),bar=$('.bar'),grp=$('.grp'),sub=$('.sub');
const vib=navigator.vibrate?navigator.vibrate.bind(navigator):null;
let fr=null,zg2=null,tab=null;
const extras=[];

/* ---------- helpers ---------- */
function ratioVal(){
 if(P.rt!=='auto'){const a=P.rt.split(':');return a[0]/a[1]}
 const V=S.clips.filter(k=>k.tr==='V1'||k.tr==='V2');
 const k=V.find(k=>ph>=k.s&&ph<k.s+k.d)||V[0],el=k&&E[k.mid];
 const w=el&&(el.videoWidth||el.naturalWidth),h=el&&(el.videoHeight||el.naturalHeight);
 return w&&h?w/h:16/9}
function layout(){
 if(!fr)return;
 const W=pv.clientWidth-8,H=pv.clientHeight-8;if(W<20||H<20)return;
 const r=ratioVal();let fw=W,fh=W/r;if(fh>H){fh=H;fw=H*r}
 fw=Math.round(fw);fh=Math.round(fh);
 let cw,ch;if(r<16/9){ch=fh;cw=fh*16/9}else{cw=fw;ch=fw*9/16}
 const set=(el,k,v)=>{if(el.style[k]!==v)el.style[k]=v};
 set(fr,'width',fw+'px');set(fr,'height',fh+'px');
 set(cv,'width',cw.toFixed(1)+'px');set(cv,'height',ch.toFixed(1)+'px')}
function guides(){
 if(!zg2)return;
 const g=P.gd|0,L=(d,p)=>'linear-gradient('+d+',transparent calc('+p+'% - .5px),rgba(255,255,255,.55) calc('+p+'% - .5px) calc('+p+'% + .5px),transparent calc('+p+'% + .5px))';
 zg2.innerHTML='';let b=[];
 if(g==1)b=[L('90deg',33.333),L('90deg',66.667),L('0deg',33.333),L('0deg',66.667)];
 else if(g==2)b=[L('90deg',50),L('0deg',50)];
 else if(g==4){for(let i=1;i<6;i++)b.push(L('90deg',i*100/6));for(let i=1;i<4;i++)b.push(L('0deg',i*25))}
 else if(g==3)zg2.innerHTML='<div style="position:absolute;inset:5%;border:1px dashed rgba(255,255,255,.55);border-radius:4px"></div><div style="position:absolute;inset:10%;border:1px dashed rgba(255,255,255,.3);border-radius:4px"></div>';
 zg2.style.background=b.length?b.join(','):'none'}
function apply(){
 const t=TH[P.th]||TH.gold,s=root.style;
 s.setProperty('--a',t.a);s.setProperty('--g1',t.g1);s.setProperty('--g2',t.g2);s.setProperty('--g3',t.g3);
 s.setProperty('--g','linear-gradient(135deg,'+t.g1+' 0%,'+t.g2+' 55%,'+t.g3+' 100%)');
 s.setProperty('--on',t.on);s.setProperty('--glow',rgba(t.g2,.42));s.setProperty('--soft',rgba(t.a,.16));
 s.setProperty('--is',IS[P.is]+'px');s.setProperty('--tlh',TLH[P.tl]+'px');
 root.classList.toggle('zp-nolbl',!P.lb);root.classList.toggle('zp-norail',!P.sr);root.classList.toggle('zp-calm',!P.an);
 if(vib)navigator.vibrate=P.hp?vib:()=>false;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content='#060608';
 guides();layout();try{R()}catch(e){}}
function cycRatio(){P.rt=RT[(RT.indexOf(P.rt)+1)%RT.length];save();layout();toast('Ratio: '+(P.rt==='auto'?'Auto (follows video)':P.rt))}
function cycGuides(){P.gd=((P.gd|0)+1)%GD.length;save();guides();toast('Guides: '+GD[P.gd])}
const dockEls=()=>[$('#qt'),$('#zdh'),bar].filter(Boolean);
function dock(h){
 const H=document.documentElement;
 if(h){
  dockEls().forEach(e=>{e.style.transition='transform .24s ease-in,opacity .24s';e.style.transform='translateX(100%)';e.style.opacity='0'});
  setTimeout(()=>{H.classList.add('zp-dock');dockEls().forEach(e=>{e.style.transition='';e.style.transform='';e.style.opacity=''});if(tab)tab.classList.add('on')},250);
 }else{
  H.classList.remove('zp-dock');if(tab)tab.classList.remove('on');
  dockEls().forEach(e=>{e.style.transition='none';e.style.transform='translateX(100%)';e.style.opacity='0'});
  void bar.offsetWidth;
  dockEls().forEach(e=>{e.style.transition='transform .3s cubic-bezier(.22,1,.36,1),opacity .3s';e.style.transform='';e.style.opacity=''});
  setTimeout(()=>dockEls().forEach(e=>e.style.transition=''),330);
 }
 setTimeout(layout,60)}
function hardReset(){
 stop();S={name:'Untitled project',clips:[],media:{}};hist=[];fut=[];sel=null;ph=0;pps=4;
 [E,BL,PK].forEach(o=>{for(const k in o)delete o[k]});
 try{localStorage.removeItem('cutroom')}catch(e){}
 $('#nm').value=S.name;
 ['#bin','#adj','#adj3','#adj4','#adj5','#adj6','#adj7','#zset','#zmg'].forEach(q=>{const e=$(q);if(e)e.classList.remove('on')});
 try{bin()}catch(e){}

function resetMenu(){
 xov('<div class=xb><b>Reset</b><p>Choose what you want to do.</p><button id=zr1>'+IC('rotate')+' Reload editor</button><p style="font-size:12px">Refreshes the app. Your project stays saved.</p><button id=zr2>'+IC('trash')+' Start over from zero</button><p style="font-size:12px">Clears timeline and media. Cannot be undone.</p><button id=zr3>Cancel</button></div>');
 $('#zr1').onclick=()=>{try{localStorage.setItem('cutroom',JSON.stringify({S,ph,uid}))}catch(e){}location.reload()};
 $('#zr2').onclick=()=>{hardReset();$('#xov').classList.remove('on')};
 $('#zr3').onclick=()=>$('#xov').classList.remove('on')}

/* ---------- parts ---------- */
part('icons',()=>{
 const d=document.querySelector('svg defs');if(!d)return;
 d.insertAdjacentHTML('beforeend',
 '<symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></symbol>'+
 '<symbol id="i-flip" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></symbol>'+
 '<symbol id="i-rot90" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>'+
 '<symbol id="i-volx" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>'+
 '<symbol id="i-ratio" viewBox="0 0 24 24"><rect width="12" height="20" x="6" y="2" rx="2"/></symbol>'+
 '<symbol id="i-grid" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>')});

part('frame',()=>{
 fr=document.createElement('div');fr.id='zfr';pv.insertBefore(fr,cv);fr.appendChild(cv);
 zg2=document.createElement('div');zg2.id='zg2';fr.appendChild(zg2);
 if(window.ResizeObserver)new ResizeObserver(layout).observe(pv);

part('rails',()=>{

 const L=mk('zrl','l'),Rr=mk('zrr','r');

 const go=id=>()=>{const b=document.getElementById(id);if(b)b.click()};
 rb(L,'ratio','Ratio',cycRatio);rb(L,'grid','Guides',cycGuides);rb(L,'chr','Hide tools',()=>dock(1));rb(L,'sliders','Settings',go('set'));
 rb(Rr,'palette','Looks',go('ad'));rb(Rr,'sparkles','Effects',go('fxb'));rb(Rr,'move','Motion',go('mot'));rb(Rr,'type','Text style',go('txb'));rb(Rr,'music','Audio',go('aub'));
 setInterval(()=>{[L,Rr].forEach(r=>{r.style.opacity=playing?'0':'1';r.style.pointerEvents=playing?'none':''})},250)});

part('dock',()=>{
 const h=document.createElement('div');h.id='zdh';h.innerHTML='<i></i>';bar.before(h);
 tab=document.createElement('button');tab.id='zdt';tab.setAttribute('aria-label','Show tools');tab.innerHTML=IC('chl');tab.onclick=()=>dock(0);document.body.appendChild(tab);
 let x0=0,y0=0;
 h.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 h.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))dock(1)},{passive:true});
 let tx0=0;
 tab.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
 tab.addEventListener('touchend',e=>{if(tx0-e.changedTouches[0].clientX>20)dock(0)},{passive:true})});

part('focus',()=>{
 const tool=(g,id,ic,lb,fn)=>{const b=document.createElement('button');b.id=id;b.dataset.g=g;b.innerHTML=IC(ic)+'<span>'+lb+'</span>';b.onclick=fn;b.style.display='none';sub.appendChild(b);extras.push(b)};
 const one=()=>{const k=selClip();return k&&k.fx==null&&!k.tx?k:null};
 tool(1,'zfl','flip','Flip',()=>{const k=one();if(!k||MT(k)==='audio')return toast('Tap a video or photo clip first');push();k.xf={...k.xf,fl:k.xf&&k.xf.fl?0:1};R();toast('Flipped')});
 tool(1,'zro','rot90','Rotate',()=>{const k=one();if(!k||MT(k)==='audio')return toast('Tap a video or photo clip first');let r=((k.xf&&k.xf.r)||0)+90;if(r>180)r-=360;push();k.xf={...k.xf,r};R();toast('Rotation '+r+' deg')});

 tool(6,'zts','skipb','To start',()=>{stop();ph=0;R()});
 tool(6,'zte','skipf','To end',()=>{stop();ph=Math.max(0,end());R()});
 tool(6,'zrt','ratio','Ratio',cycRatio);
 tool(6,'zgu','grid','Guides',cycGuides);
 tool(6,'zdk','chr','Hide tools',()=>dock(1));
 const sync=()=>{
  bar.classList.toggle('fc',!!grp.querySelector('button.act'));
  const idx=[...grp.children].findIndex(b=>b.classList.contains('act'));
  extras.forEach(b=>{b.style.display=+b.dataset.g===idx?'':'none'})};

 if(!sub.classList.contains('off'))grp.children[1].click();
 sync()});

part('reset',()=>{
 const b=document.createElement('button');b.className='ib';b.id='zrs';b.title='Reset';b.setAttribute('aria-label','Reset');b.innerHTML=IC('rotate');

part('timeline',()=>{
 const lanesOf=name=>{
  const cs=S.clips.filter(k=>k.tr===name).sort((a,b)=>a.s-b.s||a.id-b.id),ends=[],map={};
  cs.forEach(k=>{let l=0;while(ends[l]!==undefined&&ends[l]>k.s)l++;ends[l]=k.s+k.d;map[k.id]=l});
  return{n:Math.max(1,ends.length),map}};
 let hinted=0;
 function post(){
  T.querySelectorAll('.row').forEach(row=>{
   const em=row.querySelector('em');if(!em)return;
   const L=lanesOf(em.textContent.trim());
   row.style.height=L.n>1?(L.n*26+4)+'px':'';
   row.querySelectorAll('.clip').forEach(el=>{el.style.top=L.n>1?(2+(L.map[el.dataset.id]||0)*26)+'px':''})});
  const p=T.querySelector('#ph');
  if(p){p.style.top=T.scrollTop+'px';p.style.bottom='auto';p.style.height=T.clientHeight+'px'}
  if(!hinted&&T.scrollHeight>T.clientHeight+6){hinted=1;toast('Swipe up or down on the timeline to see more layers')}}
 const _tl=tl;
 tl=function(){_tl();try{post()}catch(e){}};

 const trackAt=y=>{for(const row of T.querySelectorAll('.row')){const r=row.getBoundingClientRect();if(y>=r.top&&y<r.bottom){const em=row.querySelector('em');return em&&em.textContent.trim()}}return null};
 const pts=new Set();let mv=null,vs=null,tapId=0,moved=0,ox=0,oy=0;
 T.addEventListener('pointerdown',e=>{
  pts.add(e.pointerId);moved=0;mv=null;vs=null;
  if(pts.size>1)return;
  ox=e.clientX;oy=e.clientY;
  const cl=e.target.closest&&e.target.closest('.clip');
  tapId=cl?+cl.dataset.id:0;
  if(cl&&!e.target.closest('u')&&+cl.dataset.id===sel){const k=selClip();if(k)mv={id:k.id,x:e.clientX,y:e.clientY,s:k.s,on:0,p:0}}
  else if(!e.target.closest('u')&&T.scrollHeight>T.clientHeight+4)vs={x:e.clientX,y:e.clientY,st:T.scrollTop,dec:0,fix:0};
 },true);
 T.addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-ox,e.clientY-oy)>6)moved=1;
  if(mv){
   e.stopImmediatePropagation();
   const dx=e.clientX-mv.x,dy=e.clientY-mv.y;
   if(!mv.on){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;mv.on=1;if(g)g.m=1}
   const k=S.clips.find(x=>x.id===mv.id);if(!k)return;

 function rs(){const s=ov.querySelector('#zq3s'),W=R3>=1?1280:Math.round(1280*R3),H=R3>=1?Math.round(1280/R3):1280,w=Math.min(s.clientWidth,s.clientHeight*R3);

 async function toTl(){if(rcd)return;const mt=['video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mt)return toast('Recording is not supported here');
