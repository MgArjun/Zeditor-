<script>

/* import */

$("#file").onchange=async e=>{
 let nn=0;for(const f of [...e.target.files]){
  const id=f.name+"_"+f.size,url=URL.createObjectURL(f);

   else{el=document.createElement(type);el.src=url;el.preload="auto";el.playsInline=true;el.onseeked=R;

  }catch(x){toast("Cannot open "+f.name+". Codec may be unsupported in this browser.");continue}
  if(f.size<400e6)dbPut({id:"m_"+id,blob:f});E[id]=el;BL[id]=f;S.media[id]={name:f.name,type,dur};if(type!="image"){wire(id);if(f.size<120e6)peaks(id,f)}addClip(id);nn++
 }
 e.target.value="";bin();if(nn){$("#fit").click();ph=0;toast("Added "+nn+" file"+(nn>1?"s":"")+" to the timeline")}R()};
function bin(){
 const ids=Object.keys(S.media);

 $("#bin").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addClip(b.dataset.add));
}
function addClip(mid){
 const m=S.media[mid],tr=m.type=="audio"?"A1":"V1";push();

/* edit tools */
function split(){
 const tg=sel?[selClip()].filter(Boolean):S.clips.filter(k=>k.tr!="A1"||true);

 if(!hit.length)return toast("Move playhead inside a clip to split");

$("#un").onclick=undo;$("#re").onclick=redo;

const go=n=>{stop();ph=Math.max(0,ph+n);R()};

 const on=ph>=k.s&&ph<k.s+k.d,t=(k.i+(ph-k.s)*SP(k))/FPS;
 if(on&&k.rv){el.pause();const tr=TT(k);if(Math.abs(el.currentTime-tr)>.04)el.currentTime=tr}else if(on){applyA(k,el);el.playbackRate=Math.min(16,Math.max(.0625,SP(k)));if(el.paused){el.currentTime=t;el.play().catch(()=>{})}else if(Math.abs(el.currentTime-t)>.3)el.currentTime=t}
